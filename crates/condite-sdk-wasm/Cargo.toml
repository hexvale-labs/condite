[package]
name = "condite-sdk-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
condite-sdk = { version = "0.1.0", path = "../condite-sdk", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
serde = "1"
js-sys = "0.3"
