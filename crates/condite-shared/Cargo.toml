[package]
name = "condite-shared"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
typescript = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "export-types"
required-features = ["typescript"]
