[package]
name = "condite-ctl"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
condite-config = { path = "../condite-config" }
serde = { workspace = true, features = ["derive"] }
dotenv = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json", "rustls"] }
jiff = { workspace = true }
socket2 = "0.6"
anyhow = { workspace = true }
clap = { workspace = true }
condite-shared = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
