[package]
name = "condite-core"
version = "0.1.0"
edition = "2024"
default-run = "condite-core"
license = "AGPL-3.0-or-later"

[dependencies]
tower-http = { version = "0.6.11", features = ["cors"] }
getrandom = { workspace = true }
sha2 = { workspace = true }
condite-shared = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
dotenv = { workspace = true }
anyhow = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
uuid = { workspace = true, features = ["v7", "fast-rng", "serde"] }
jiff = { workspace = true, features = ["serde"] }
toasty = { workspace = true, features = ["turso", "postgresql", "mariadb", "jiff", "migration"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toasty-cli = { workspace = true }
axum-anyhow = { workspace = true }
mime2ext = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }

[features]
default = []
docker = []

[dev-dependencies]
tempfile = "3"
condite-sdk = { workspace = true, features = ["rustls"] }
tower = { workspace = true, features = ["util"] }
