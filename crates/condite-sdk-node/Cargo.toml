[package]
name = "condite-sdk-node"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
condite-sdk = { workspace = true, features = ["rustls"] }
napi = { workspace = true, features = ["napi6", "tokio_rt", "dyn-symbols"] }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }
