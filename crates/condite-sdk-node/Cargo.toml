[package]
name = "condite-sdk-node"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]
test = false

[dependencies]
condite-sdk = { version = "0.1.0", path = "../condite-sdk" }
napi = { version = "3", default-features = false, features = ["napi6", "tokio_rt", "dyn-symbols"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
