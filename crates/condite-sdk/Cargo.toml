[package]
name = "condite-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls"]

[dependencies]
condite-metadata = { workspace = true }
condite-shared = { workspace = true }
reqwest = { workspace = true, features = ["json", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }
axum = { workspace = true }
