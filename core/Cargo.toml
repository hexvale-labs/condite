[package]
name = "condite-core"
version = "0.1.0"
edition = "2024"

[lints.clippy]
all = "warn"

[dependencies]
axum = "0.8.9"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
sea-orm = { version = "2.0.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
dotenv = "0.15.0"
anyhow = "1.0.104"
aws-sdk-s3 = "1.156.0"
aws-config = "1.13.0"
uuid = {version = "1.29.0", features = ["v7", "fast-rng"]}
chrono = "0.4.45"
