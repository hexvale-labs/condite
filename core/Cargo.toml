[package]
name = "condite-core"
version = "0.1.0"
edition = "2024"
default-run = "condite-core"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.8.9"
serde = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
dotenv = "0.15.0"
anyhow = "1.0.104"
aws-sdk-s3 = "1.156.0"
aws-config = "1.13.0"
uuid = {version = "1.29.0", features = ["v7", "fast-rng"]}
jiff = {version = "0.2.38", features = ["serde"]}
toasty = { version = "0.11.0", features = ["turso", "postgresql", "mariadb", "jiff", "migration"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
toasty-cli = "0.11.0"
axum-anyhow = "0.11.14"
mime2ext = "0.1.54"
