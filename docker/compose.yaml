services:
  core:
    image: ghcr.io/hexvale-labs/condite/core:${CORE_VERSION:-0.1.0}
    env_file: ../crates/condite-core/.env
    volumes:
      - core-data:/app/data
      - ./examples/core.toml:/app/data/condite.toml:ro
    ports:
      - '8080:8080'
    restart: unless-stopped
    stop_grace_period: 30s
  dashboard:
    image: ghcr.io/hexvale-labs/condite/dashboard:${DASHBOARD_VERSION:-0.1.0}
    volumes:
      - ./examples/dashboard.toml:/app/clients/dashboard/dashboard.toml:ro
    ports:
      - '4321:4321'
    restart: unless-stopped
    depends_on:
      - core
volumes:
  core-data:
