# Use with exactly one ingress example; see README.md.
services:
  core:
    image: ghcr.io/hexvale-labs/condite/core:${CORE_VERSION:-0.1.0}
    env_file: ../../crates/condite-core/.env
    volumes:
      - core-data:/app/data
      - ./core.toml:/app/data/condite.toml:ro
    networks: [backend, egress]
    restart: unless-stopped
    stop_grace_period: 30s
  dashboard:
    image: ghcr.io/hexvale-labs/condite/dashboard:${DASHBOARD_VERSION:-0.1.0}
    volumes:
      - ./dashboard.toml:/app/clients/dashboard/dashboard.toml:ro
    networks: [backend]
    depends_on: [core]
    restart: unless-stopped
networks:
  backend:
    internal: true
  # Core needs outbound access to S3; ingress needs certificates or tunnel access.
  egress: {}
volumes:
  core-data:
