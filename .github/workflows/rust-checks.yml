name: Rust checks

on:
  push:
  pull_request:

jobs:
  rust-checks:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run Rust checks
        run: ./scripts/check-rust.sh
