name: SDK checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2.9.3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libgtk-3-0t64 xvfb
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm run build:sdk
      - run: npm run check:consumer
      - run: npm run lint:sdk
      - run: npm run test:sdk
      - run: cargo clippy --locked -p condite-sdk-wasm --target wasm32-unknown-unknown --all-features -- -D warnings
      - name: Upload measured sizes
        uses: actions/upload-artifact@v6
        with:
          name: sdk-sizes
          path: target/sdk-sizes.json
