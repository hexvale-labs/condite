name: SDK checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-bin: false
          key: ${{ hashFiles('Cargo.toml') }}
          # target/sdk is nested under target; the consumer is a separate workspace.
          workspaces: |
            . -> target
            examples/sdk-consumer -> target
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps --only-shell chromium
      - run: sudo apt-get install -y libgtk-3-0t64 xvfb
      - name: Read locked wasm-bindgen version
        id: wasm-bindgen
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib

          with open("Cargo.lock", "rb") as lockfile:
              packages = tomllib.load(lockfile)["package"]
          versions = {p["version"] for p in packages if p["name"] == "wasm-bindgen"}
          if len(versions) != 1:
              raise SystemExit(f"Expected one wasm-bindgen version, got {versions}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={versions.pop()}", file=output)
          PYTHON
      - name: Install matching prebuilt wasm-bindgen CLI
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
          fallback: none
      - run: npm run build:sdk
      - run: npm run check:consumer
      - run: npm run lint:sdk
      - run: npm run test:sdk
      - run: cargo clippy --locked -p condite-sdk-wasm --target wasm32-unknown-unknown --all-features -- -D warnings
      - name: Upload measured sizes
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-sizes
          path: target/sdk-sizes.json
          if-no-files-found: error
